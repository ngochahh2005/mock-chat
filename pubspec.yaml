name: base_bloc_3
description: A new base project using bloc, Clean Architecture on Flutter 3.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  auto_route: ^11.1.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.0.0
  copy_with_extension: ^16.0.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  equatable: ^2.0.7
  event_bus: ^2.0.1
  firebase_core: ^4.2.1
  firebase_core_platform_interface: ^8.1.0
  firebase_messaging: ^16.0.4
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^22.2.0
  flutter_screenutil: ^5.9.3
  flutter_smart_dialog: ^5.1.1
  flutter_svg: ^2.2.3
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  infinite_scroll_pagination: ^5.1.1
  injectable: ^3.0.0
  json_annotation: ^4.9.0
  logger: ^2.6.2
  permission_handler: ^11.4.0
  retrofit: ^4.4.0
  shared_preferences: ^2.5.3
  sliver_tools: ^0.2.12
  talker: ^5.1.3
  talker_dio_logger: ^5.1.3
  talker_flutter: ^5.1.3
  go_router: ^17.0.0
  jwt_decoder: ^2.0.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  flutter_secure_storage: ^11.0.0
  firebase_storage: ^13.4.6
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  copy_with_extension_gen: ^16.0.0
  flutter_gen_runner: ^5.12.0
  flutter_lints: ^6.0.0
  freezed: ^4.0.0-dev.3
  injectable_generator: ^3.1.1
  json_serializable: ^6.11.2
  retrofit_generator: ^10.2.0
  intl_utils: ^2.8.12
flutter_gen:

  output: lib/gen/
  line_length: 80

  integrations:
    flutter_svg: true

  assets:
    enabled: true

  fonts:
    enabled: true


flutter:
  uses-material-design: true
  fonts:
    - family: exo
      fonts:
        - asset: assets/fonts/exo/Exo-Italic.ttf
          style: italic
        - asset: assets/fonts/exo/Exo-Light.ttf
          weight: 100
        - asset: assets/fonts/exo/Exo-Light.ttf
          weight: 200
        - asset: assets/fonts/exo/Exo-Light.ttf
          weight: 300
        - asset: assets/fonts/exo/Exo-Regular.ttf
          weight: 400
        - asset: assets/fonts/exo/Exo-Medium.ttf
          weight: 500
        - asset: assets/fonts/exo/Exo-Medium.ttf
          weight: 600
        - asset: assets/fonts/exo/Exo-Bold.ttf
          weight: 700
        - asset: assets/fonts/exo/Exo-Bold.ttf
          weight: 800
        - asset: assets/fonts/exo/Exo-Bold.ttf
          weight: 900
    - family: lato
      fonts:
        - asset: assets/fonts/lato/Lato-Italic.ttf
          style: italic
        - asset: assets/fonts/lato/Lato-Light.ttf
          weight: 100
        - asset: assets/fonts/lato/Lato-Light.ttf
          weight: 200
        - asset: assets/fonts/lato/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/lato/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/lato/Lato-Medium.ttf
          weight: 500
        - asset: assets/fonts/lato/Lato-Medium.ttf
          weight: 600
        - asset: assets/fonts/lato/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/lato/Lato-Bold.ttf
          weight: 800
        - asset: assets/fonts/lato/Lato-Bold.ttf
          weight: 900
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 100
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 200
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 600
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
